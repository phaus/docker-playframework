name: Build and Push Docker Images

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - PLAY_VERSION: "1.11.0"
            JDK_VERSION: "21.0.13-jdk"
          - PLAY_VERSION: "1.10.0"
            JDK_VERSION: "21.0.13-jdk"
          - PLAY_VERSION: "1.9.0"
            JDK_VERSION: "21.0.13-jdk"
          - PLAY_VERSION: "1.8.0"
            JDK_VERSION: "21.0.13-jdk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Play ${{ matrix.PLAY_VERSION }}
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.PLAY_VERSION }}-${{ matrix.JDK_VERSION }}
            type=raw,value=${{ matrix.PLAY_VERSION }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Play ${{ matrix.PLAY_VERSION }}
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLAY_VERSION=${{ matrix.PLAY_VERSION }}
            JDK_VERSION=${{ matrix.JDK_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.PLAY_VERSION }}-${{ matrix.JDK_VERSION }}
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.PLAY_VERSION }}-${{ matrix.JDK_VERSION }} play version

  # Optional: Create multi-platform manifest for latest tag
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:1.11.0-21.0.13-jdk